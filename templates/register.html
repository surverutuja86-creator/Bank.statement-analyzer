<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Smart Bank Statement Analyzer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; position: relative;">

    <!-- Background Ambient Glow -->
    <div style="position: absolute; top: 15%; right: 25%; width: 320px; height: 320px; background: rgba(16, 185, 129, 0.2); filter: blur(100px); border-radius: 50%; pointer-events: none;"></div>
    <div style="position: absolute; bottom: 15%; left: 25%; width: 320px; height: 320px; background: rgba(6, 182, 212, 0.2); filter: blur(100px); border-radius: 50%; pointer-events: none;"></div>

    <div class="glass-card" style="width: 100%; max-width: 480px; padding: 2.5rem; border-radius: var(--radius-lg); z-index: 10;">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <a href="/" class="logo" style="justify-content: center; margin-bottom: 0.75rem;">
                <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
                <span>FinPulse <span class="text-gradient">AI</span></span>
            </a>
            <h2 style="font-family: var(--font-heading); font-size: 1.75rem; margin-bottom: 0.25rem;">Create Your Account</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Start analyzing statements with exact decimal precision</p>
        </div>

        <div id="authAlert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.875rem;"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Alex Morgan" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="alex@example.com" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="alexmorgan" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;"><i class="fas fa-user-plus"></i> Create Account</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-light); font-size: 0.9rem; color: var(--text-muted);">
            Already registered? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('authAlert');

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name: fullName, email, username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alertBox.style.display = 'block';
                    alertBox.style.background = 'rgba(244, 63, 94, 0.15)';
                    alertBox.style.color = '#f87171';
                    alertBox.style.border = '1px solid rgba(244, 63, 94, 0.3)';
                    alertBox.innerText = data.error;
                } else {
                    alertBox.style.display = 'block';
                    alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
                    alertBox.style.color = '#34d399';
                    alertBox.style.border = '1px solid rgba(16, 185, 129, 0.3)';
                    alertBox.innerText = data.message;
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                }
            })
            .catch(() => {
                alertBox.style.display = 'block';
                alertBox.innerText = 'Registration failed. Please check inputs.';
            });
        });
    </script>
</body>
</html>
